<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons / app icons (assets live in /public, source of truth in /branding) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#15233F" />

    <title>Alojaneo — Hotel management</title>
    <meta
      name="description"
      content="Alojaneo is a hotel reservation and property-management system: bookings, rooms, rates, guests, housekeeping, payments, and a direct booking engine."
    />

    <!-- Social preview. og:image should be an absolute URL in production;
         update the domain once deployed. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alojaneo — Hotel management" />
    <meta
      property="og:description"
      content="Bookings, rooms, rates, guests, housekeeping, payments, and a direct booking engine."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
