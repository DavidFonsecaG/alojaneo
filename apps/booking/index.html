<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons / app icons (source of truth in /branding) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#15233F" />

    <title>Book your stay · Alojaneo</title>
    <meta
      name="description"
      content="Book your stay directly — live room availability and instant reservations, powered by Alojaneo."
    />

    <!-- Social preview for shared booking links. This is a single app-level
         image; a per-hotel preview would need server-side rendering. Update the
         og:image/og:url domain once deployed. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Book your stay" />
    <meta
      property="og:description"
      content="Live availability and instant direct booking, powered by Alojaneo."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
